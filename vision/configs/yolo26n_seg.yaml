# Training configuration for the segmentation student. These are starting
# choices, not tuned results. notebooks/colab_train_village.ipynb passes model, data,
# project, name, epochs and (for village-v2) imgsz=1024 on top of this file; Ultralytics
# saves every run's complete arguments as <run>/args.yaml next to its weights.
model: yolo26n-seg.pt        # exists in ultralytics 8.4.x; weights download on first use
data: data/datasets/leftover/data.yaml
imgsz: 640
epochs: 100
batch: 8
patience: 25
seed: 0
workers: 2
# Plates are seen from straight above, so any rotation or flip is realistic.
degrees: 180.0
flipud: 0.5
fliplr: 0.5
mosaic: 1.0
mixup: 0.1
copy_paste: 0.5
hsv_v: 0.4
