# Training configuration for the segmentation student. These are starting
# choices, not tuned results; the committed copy must always be the one that
# produced the numbers in eval/results/.
model: yolo26n-seg.pt        # exists in ultralytics 8.4.x; weights download on first use
data: data/datasets/leftover/data.yaml
imgsz: 640
epochs: 100
batch: 16
patience: 20
seed: 0
# Plates are seen from straight above, so any rotation or flip is realistic.
degrees: 180.0
flipud: 0.5
fliplr: 0.5
mosaic: 1.0
mixup: 0.1
copy_paste: 0.5
hsv_v: 0.4
