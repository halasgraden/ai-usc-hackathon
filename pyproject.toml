[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "leftover-lens"
version = "0.1.0"
description = "Plate-waste camera for USC Village Dining Hall: per-dish waste numbers from a dish-return camera."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Live path on the rig: camera, ArUco, ONNX inference.
vision = ["opencv-contrib-python-headless>=4.10", "onnxruntime>=1.19"]
# Training and matching. Versions are deliberately unpinned until the first
# successful install; pin them in this file the moment training works.
# SAM 3 and Depth Anything 3 install from their GitHub repos (see README).
train = ["ultralytics", "torch", "torchvision"]
match = ["transformers", "torch", "pillow"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "opencv-contrib-python-headless>=4.10"]

[tool.setuptools]
packages = ["core", "capture", "labeling", "augment", "vision", "depth", "portion", "menu", "analytics", "api", "eval"]

[tool.setuptools.package-data]
menu = ["data/*.yaml"]
portion = ["*.yaml"]
vision = ["configs/*.yaml"]
labeling = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^dashboard/", "^build/"]

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "onnxruntime", "ultralytics", "transformers", "torch", "fiftyone", "fiftyone.*"]
ignore_missing_imports = true
